<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/bootstrap.min.css">

    <title>Bootstrap Typography</title>
</head>
<body>

    <div class="container mt-5">

        <h1 class="display-1">
            Bootstrap Heading
        </h1>

        <p class="lead">
            This is a lead paragraph using Bootstrap.
        </p>

        <p class="fw-bold">
            This text is bold.
        </p>

        <p class="text-muted">
            This text is muted.
        </p>

        <p class="text-uppercase">
            uppercase text
        </p>

        <p class="text-lowercase">
            LOWERCASE TEXT
        </p>

        <p class="text-capitalize">
            bootstrap typography utilities
        </p>

    </div>

    <script src="js/bootstrap.bundle.min.js"></script>

</body>
</html>
