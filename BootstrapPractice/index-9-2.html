<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/bootstrap.min.css">

    <title>Bootstrap Exercise 9.2</title>
</head>
<body>

    <div class="container mt-5">

        <h2 class="mb-4">Button Groups</h2>

        <div class="btn-group mb-4">

            <button class="btn btn-primary">
                Left
            </button>

            <button class="btn btn-success">
                Middle
            </button>

            <button class="btn btn-danger">
                Right
            </button>

        </div>

        <h2 class="mb-4">Toggle Buttons</h2>

        <div class="btn-group" role="group">

            <input type="checkbox" class="btn-check" id="btn1">

            <label class="btn btn-outline-primary" for="btn1">
                Option 1
            </label>

            <input type="checkbox" class="btn-check" id="btn2">

            <label class="btn btn-outline-success" for="btn2">
                Option 2
            </label>

            <input type="checkbox" class="btn-check" id="btn3">

            <label class="btn btn-outline-danger" for="btn3">
                Option 3
            </label>

        </div>

    </div>

    <script src="js/bootstrap.bundle.min.js"></script>

</body>
</html>
