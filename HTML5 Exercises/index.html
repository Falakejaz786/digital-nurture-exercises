<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Local Community Event Portal</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f2f6ff;
        }

        nav {
            background: #004aad;
            padding: 10px;
        }

        nav a {
            color: white;
            margin: 10px;
            text-decoration: none;
        }

        nav a:hover {
            text-decoration: underline;
        }

        #welcomeBanner {
            background: blue;
            color: white;
            padding: 15px;
            text-align: center;
        }

        .highlight {
            background: yellow;
            padding: 2px;
        }

        .gallery {
            width: 100%;
            border-collapse: collapse;
            margin: 10px;
        }

        .gallery img {
            width: 100%;
            height: 120px;
            border: 2px solid #333;
        }

        form {
            margin: 20px;
            padding: 15px;
            background: white;
            border-radius: 10px;
        }

        input, select, textarea {
            width: 100%;
            margin: 5px 0;
            padding: 8px;
        }

        video {
            width: 300px;
            margin: 10px;
        }
    </style>
</head>

<body onbeforeunload="return checkLeave()">

<!-- Navigation -->
<nav>
    <a href="#home">Home</a>
    <a href="#events">Events</a>
    <a href="#contact">Contact</a>
    <a href="help.html" target="_blank">Help</a>
</nav>

<!-- Welcome Section -->
<div id="welcomeBanner">
    Welcome to Community Portal
    <span style="color:red; font-weight:bold;">Special Offer Today!</span>
</div>

<!-- Main -->
<section id="home">
    <h2>Home</h2>
    <p class="highlight">Welcome to your city event portal.</p>
</section>

<section id="events">
    <h2>Events Gallery</h2>

    <table class="gallery" border="1">
        <tr>
            <td><img src="https://via.placeholder.com/150" ondblclick="enlarge(this)" title="Event 1"></td>
            <td><img src="https://via.placeholder.com/150" ondblclick="enlarge(this)" title="Event 2"></td>
            <td><img src="https://via.placeholder.com/150" ondblclick="enlarge(this)" title="Event 3"></td>
        </tr>
        <tr>
            <td><img src="https://via.placeholder.com/150" ondblclick="enlarge(this)" title="Event 4"></td>
            <td><img src="https://via.placeholder.com/150" ondblclick="enlarge(this)" title="Event 5"></td>
            <td><img src="https://via.placeholder.com/150" ondblclick="enlarge(this)" title="Event 6"></td>
        </tr>
    </table>
</section>

<!-- Registration Form -->
<section id="contact">
    <h2>Event Registration</h2>

    <form onsubmit="submitForm(event)">
        <input type="text" id="name" placeholder="Enter Name" required autofocus>

        <input type="email" id="email" placeholder="Enter Email" required>

        <input type="date" id="date">

        <select id="eventType" onchange="savePreference()">
            <option value="">Select Event</option>
            <option value="Music">Music</option>
            <option value="Food">Food</option>
            <option value="Tech">Tech</option>
        </select>

        <textarea id="message" placeholder="Your message" onkeyup="countChars()"></textarea>

        <input type="text" id="phone" placeholder="Phone Number" onblur="validatePhone()">

        <p>Characters: <span id="charCount">0</span></p>

        <button type="submit" onclick="showConfirm()">Submit</button>

        <output id="result"></output>
    </form>

    <button onclick="getLocation()">Find Nearby Events</button>
    <p id="location"></p>

    <button onclick="clearPrefs()">Clear Preferences</button>

    <p>Selected Fee: <span id="fee"></span></p>
</section>

<!-- Video -->
<video controls oncanplay="videoReady()">
    <source src="https://www.w3schools.com/html/mov_bbb.mp4">
</video>
<p id="videoMsg"></p>

<script>
    function submitForm(e) {
        e.preventDefault();
        document.getElementById("result").value = "Form Submitted Successfully!";
    }

    function showConfirm() {
        console.log("Submit clicked");
    }

    function validatePhone() {
        let phone = document.getElementById("phone").value;
        if (phone.length < 10) {
            alert("Invalid phone number");
        }
    }

    function countChars() {
        let text = document.getElementById("message").value;
        document.getElementById("charCount").innerText = text.length;
    }

    function enlarge(img) {
        img.style.width = "250px";
    }

    function videoReady() {
        document.getElementById("videoMsg").innerText = "Video ready to play";
    }

    function savePreference() {
        let type = document.getElementById("eventType").value;
        localStorage.setItem("eventType", type);
        document.getElementById("fee").innerText = type;
    }

    window.onload = function() {
        let saved = localStorage.getItem("eventType");
        if (saved) {
            document.getElementById("eventType").value = saved;
            document.getElementById("fee").innerText = saved;
        }
    }

    function clearPrefs() {
        localStorage.clear();
        sessionStorage.clear();
        alert("Preferences Cleared");
    }

    function getLocation() {
        navigator.geolocation.getCurrentPosition(
            function(pos) {
                document.getElementById("location").innerText =
                    "Lat: " + pos.coords.latitude + " Long: " + pos.coords.longitude;
            },
            function(error) {
                alert("Permission denied or error");
            },
            { enableHighAccuracy: true, timeout: 5000 }
        );
    }

    function checkLeave() {
        return "You have unsaved changes!";
    }
</script>

</body>
</html>
